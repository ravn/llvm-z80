name: Z80 backend CI

# Runs on ravn/llvm-z80 fork only; not intended for upstream llvm/llvm-project.
# Workspace-mode CI per tasks/roadmap-to-maturity.md §12.1 (Phase 1).
# Once stable, propose for promotion to llvm-z80/llvm-z80 (engagement mode).

on:
  push:
    branches: [main, "session-*", "z80-*"]
    paths:
      - 'llvm/lib/Target/Z80/**'
      - 'llvm/test/CodeGen/Z80/**'
      - 'llvm/test/MC/Z80/**'
      - 'clang/lib/Driver/ToolChains/SDCC.cpp'
      - 'clang/cmake/caches/Z80.cmake'
      - '.github/workflows/z80-ci.yml'
  pull_request:
    paths:
      - 'llvm/lib/Target/Z80/**'
      - 'llvm/test/CodeGen/Z80/**'
      - 'llvm/test/MC/Z80/**'
      - 'clang/lib/Driver/ToolChains/SDCC.cpp'
      - 'clang/cmake/caches/Z80.cmake'
      - '.github/workflows/z80-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z80-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-lit:
    name: Build clang/llc + Z80 lit suite
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify build tools (preinstalled on ubuntu-24.04 runner)
        run: |
          # The ubuntu-24.04 GitHub Actions runner image already provides
          # cmake, ninja, clang, and python3.  lld is NOT required as a
          # host tool: the Z80.cmake cache builds lld as part of LLVM
          # (LLVM_ENABLE_PROJECTS="clang;lld"), and the LLVM host link
          # uses the system linker.  This step is a sanity check; no
          # apt-get install is needed.
          cmake --version | head -1
          ninja --version
          clang --version | head -1
          python3 --version

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: z80-ci-${{ runner.os }}
          max-size: "2G"

      - name: Configure
        run: |
          cmake -C clang/cmake/caches/Z80.cmake -G Ninja -S llvm -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_OPTIMIZED_TABLEGEN=ON

      - name: Build clang + llc + lit dependencies
        run: |
          # Lit tests need FileCheck (output matching) plus a few helpers.
          # Building only clang+llc skipped these and the lit step failed
          # with "Did not find FileCheck in build/bin".  llvm-lit itself
          # is generated by cmake configure (it is a Python script in
          # build/bin/llvm-lit), not a ninja target -- including it in
          # the ninja args fails with "unknown target 'llvm-lit'".
          ninja -C build clang llc \
                FileCheck count not \
                llvm-objdump llvm-nm llvm-readobj

      - name: Run Z80 lit suite
        run: build/bin/llvm-lit -v llvm/test/CodeGen/Z80/

      - name: Run MC/Z80 lit suite (if present)
        run: |
          if [ -d llvm/test/MC/Z80 ]; then
            build/bin/llvm-lit -v llvm/test/MC/Z80/
          fi

      - name: Summary
        if: always()
        run: |
          echo "Build dir size:"
          du -sh build || true
          echo "ccache stats:"
          ccache -s || true
