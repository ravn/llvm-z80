name: Z80 backend CI

# Runs on ravn/llvm-z80 fork only; not intended for upstream llvm/llvm-project.
# Workspace-mode CI per tasks/roadmap-to-maturity.md §12.1 (Phase 1).
# Once stable, propose for promotion to llvm-z80/llvm-z80 (engagement mode).

on:
  # Tests run on the main branch only (per maintainer direction).  Feature
  # branches do not trigger CI; verify locally before merging.  workflow_dispatch
  # is kept as a manual escape hatch.
  push:
    branches: [main]
    paths:
      - 'llvm/lib/Target/Z80/**'
      - 'llvm/test/CodeGen/Z80/**'
      - 'llvm/test/MC/Z80/**'
      # The Z80/SM83 compiler-rt runtime (memcpy/memset/memchr/___umodqi3/...)
      # is built + exercised by the runtime-tests job; gate it so a helper edit
      # re-runs CI (2026-07-08: the pop-iy tightening slipped through un-gated).
      - 'compiler-rt/lib/builtins/z80/**'
      - 'compiler-rt/lib/builtins/sm83/**'
      # The runtime oracle harness + its testcases (runtime-tests job).
      - 'z80-utils/**'
      # ravn/llvm-z80#158: the TruncInstCombine "narrow through Argument" fix
      # lives in generic code; gate its regression test + the Z80 end-to-end
      # witness so drift in either re-runs CI.
      - 'llvm/lib/Transforms/AggressiveInstCombine/TruncInstCombine.cpp'
      - 'llvm/test/Transforms/AggressiveInstCombine/narrow-through-argument.ll'
      - 'clang/test/CodeGen/z80-knr-u8-rotate.c'
      - 'clang/lib/Driver/ToolChains/SDCC.cpp'
      - 'clang/lib/Driver/ToolChains/Z80.cpp'
      - 'clang/lib/Driver/ToolChains/Z80.h'
      - 'clang/lib/Basic/Targets/Z80.cpp'
      - 'clang/lib/Basic/Targets/Z80.h'
      - 'clang/include/clang/Basic/BuiltinsZ80.td'
      - 'clang/test/Driver/z80-*'
      - 'clang/test/CodeGen/z80-*'
      - 'clang/cmake/caches/Z80.cmake'
      - '.github/workflows/z80-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z80-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-lit:
    name: Build clang/llc + Z80 lit suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Force JS actions onto Node 24 -- Node 20 is deprecated on GHA runners
    # (removed Sept 2026).  Covers ccache-action@v1.2 (no Node-24 release yet);
    # actions/checkout is bumped to v5 (native Node 24) below.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify build tools (preinstalled on ubuntu-24.04 runner)
        run: |
          # The ubuntu-24.04 GitHub Actions runner image already provides
          # cmake, ninja, clang, and python3.  lld is NOT required as a
          # host tool: the Z80.cmake cache builds lld as part of LLVM
          # (LLVM_ENABLE_PROJECTS="clang;lld"), and the LLVM host link
          # uses the system linker.  This step is a sanity check; no
          # apt-get install is needed.
          cmake --version | head -1
          ninja --version
          clang --version | head -1
          python3 --version

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: z80-ci-${{ runner.os }}
          max-size: "2G"

      - name: Configure
        run: |
          cmake -C clang/cmake/caches/Z80.cmake -G Ninja -S llvm -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_OPTIMIZED_TABLEGEN=ON

      - name: Build deps + run Z80 lit suite
        run: |
          # `check-llvm-codegen-z80` is the canonical LLVM target for
          # running the Z80 lit suite: it builds llc, FileCheck,
          # llvm-config, llvm-readobj, llvm-objdump, llvm-nm, count,
          # not, llvm-objcopy, dsymutil, split-file, and ~70 other
          # binaries that the lit test harness expects to find in
          # build/bin, then runs `llvm-lit -v llvm/test/CodeGen/Z80`.
          # Listing individual deps in the ninja command line led to
          # whack-a-mole (FileCheck -> llvm-readobj -> llvm-config ->
          # ...).  Using the canonical target ensures every lit-side
          # dependency is satisfied without naming each by hand.
          ninja -C build check-llvm-codegen-z80

      - name: Run MC/Z80 lit suite (if present)
        run: |
          if [ -d llvm/test/MC/Z80 ]; then
            build/bin/llvm-lit -v llvm/test/MC/Z80/
          fi

      - name: Gate the #158 TruncInstCombine narrow-through-argument fix
        run: |
          # The fix is in generic AggressiveInstCombine, so its regression test
          # is an `opt -passes=aggressive-instcombine` test (llc never runs the
          # pass), which check-llvm-codegen-z80 does not cover.  Build opt (core
          # LLVM, the libs are already warm) and run the one target-agnostic
          # test.  Pre-fix this would leave the function entirely at i16.
          ninja -C build opt
          build/bin/llvm-lit -v \
            llvm/test/Transforms/AggressiveInstCombine/narrow-through-argument.ll

      - name: Summary
        if: always()
        run: |
          echo "Build dir size:"
          du -sh build || true
          echo "ccache stats:"
          ccache -s || true

  runtime-tests:
    name: test-runner clang suite (z88dk-ticks)
    runs-on: ubuntu-latest
    # TODO: the 120-minute budget below is far too generous -- a healthy run
    # of this job completes in ~10-15 min.  Tighten timeout-minutes to ~30
    # (or whatever the real p99 is once we re-enable + measure) so a wedged
    # build doesn't burn 2 hours of runner time before failing.
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # z88dk supplies the z88dk-ticks Z80 emulator that the test-runner shells
      # out to.  Only the emulator is needed (the clang suite compiles with the
      # just-built llvm-z80 clang and builds crt0 + compiler-rt on the fly), so a
      # plain checkout + `make -C src/ticks` is enough -- no full z88dk build.
      # Pinned to the workspace's known-good SHA so upstream drift can't redden
      # this job independently of an llvm-z80 change.
      - name: Checkout z88dk (z88dk-ticks emulator source)
        uses: actions/checkout@v5
        with:
          repository: ravn/z88dk
          ref: baae15ffc8bb7b56cf58f8ea2947e12478a818e0
          path: z88dk
          fetch-depth: 1
          # ext/uthash is a git submodule (z88dk/uthash) that ticks.h needs
          # (`-I ext/uthash/src`); checkout does not fetch submodules by default.
          submodules: true

      - name: Build z88dk-ticks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flex bison
          make -C z88dk/src/ticks -j"$(nproc)"
          # Put the emulator on PATH for subsequent steps.
          echo "$GITHUB_WORKSPACE/z88dk/src/ticks" >> "$GITHUB_PATH"

      - name: Verify build tools
        run: |
          cmake --version | head -1
          ninja --version
          clang --version | head -1
          cargo --version
          command -v z88dk-ticks   # confirm the emulator is on PATH (no exec)

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          # Share the build-and-lit cache so the clang/lld compile is warm.
          key: z80-ci-${{ runner.os }}
          max-size: "2G"

      - name: Configure
        run: |
          cmake -C clang/cmake/caches/Z80.cmake -G Ninja -S llvm -B build \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_OPTIMIZED_TABLEGEN=ON

      - name: Build clang + lld + LLVM binutils the test-runner shells out to
        run: ninja -C build clang lld llvm-objcopy llvm-nm llvm-size FileCheck

      - name: Gate the #158 K&R-u8-rotate end-to-end Z80 codegen witness
        run: |
          # Full clang pipeline (this is where AggressiveInstCombine actually
          # runs) -> the K&R u8 rotate must narrow to 8-bit ops and emit `rlca`,
          # not a 16-bit `add hl` dance.  Drive clang + FileCheck directly rather
          # than via llvm-lit: lit would pull the whole clang test harness
          # (count/not/split-file/...) which this job doesn't build.  This
          # mirrors the test's RUN line (%clang_cc1 == `clang -cc1`).
          build/bin/clang -cc1 -triple z80 -Oz -S -Wno-deprecated-non-prototype \
            -o - clang/test/CodeGen/z80-knr-u8-rotate.c \
            | build/bin/FileCheck clang/test/CodeGen/z80-knr-u8-rotate.c

      - name: Run test-runner clang suite (runtime/value oracle)
        run: |
          cd z80-utils/test-runner
          BUILD_DIR=../../build cargo run --release -- clang

      - name: Enforce -verify-machineinstrs clean at production opt levels
        run: |
          # -Oz/-Os/-O2 +static-stack across the clang corpus must be
          # verifier-clean (latent stale-liveness = the #136/#205/#197 class).
          # O0 is excluded -- it has a separate, non-production O0-coarse-liveness
          # residual; production never ships at O0.  Memory-bounded (-P 2).
          z80-utils/test-runner/scripts/verify-production.sh \
            build/bin/clang z80-utils/test-runner/testcases/clang 2

      - name: Summary
        if: always()
        run: |
          echo "ccache stats:"; ccache -s || true
